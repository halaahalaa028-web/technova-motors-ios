<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>TechNova Motors</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, sans-serif;
      background: #0E1320;
      color: #E8ECF4;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 28px;
      padding: 44px 32px;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    .icon { font-size: 52px; margin-bottom: 18px; display: block; }
    h1 { font-size: 21px; font-weight: 700; margin-bottom: 6px; }
    h2 { font-size: 15px; font-weight: 600; color: #9AA6BD; margin-bottom: 14px; }
    p { font-size: 14px; color: #9AA6BD; line-height: 1.7; margin-bottom: 26px; }
    button {
      background: #6B9CF2; color: #0E1320; border: none; border-radius: 14px;
      padding: 14px 28px; font-size: 15px; font-weight: 700; cursor: pointer; width: 100%;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="icon">📡</span>
    <h1>مفيش إنترنت</h1>
    <h2>You're offline</h2>
    <p>اتأكد من الاتصال وجرّب تاني.<br />Check your connection and try again.</p>
    <button onclick="window.location.href='https://motors.technovaos.com/auth'">جرّب تاني · Try again</button>
  </div>
</body>
</html>
